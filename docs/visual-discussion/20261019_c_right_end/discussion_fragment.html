    root.querySelector('.draft-label').hidden=false;
    const describe=(label,i)=>i===null?`${label}：尚未選擇`:`${label}：${bars[i].date}；開${bars[i].open} 高${bars[i].high} 低${bars[i].low} 收${bars[i].close}；量${fmt(+bars[i].volume_shares_scaled)}股`;
    root.querySelector('.draft').value='狀態：DRAFT_NOT_SUBMITTED_NOT_APPROVED\n參照C：2024-01-19（不是已定新帶起日）\n'+describe('待回報終點',state.draftEnd)+(state.draftEnd!==null&&state.draftEnd<g2?'\n所選日早於C，請調整。':'');
    root.dataset.draftStart=state.draftStart===null?'':bars[state.draftStart].date;
    root.dataset.draftEnd=state.draftEnd===null?'':bars[state.draftEnd].date;
  }
  function axes(svg,y,h,volume){
    svg.attr('viewBox',`0 0 ${width} ${h}`).attr('height',h);
    const ticks=Math.min(width<=400?4:6,state.count);
    const vals=Array.from({length:ticks},(_,j)=>state.first+Math.round((state.count-1)*j/(ticks-1)));
    svg.selectAll('rect[data-chart-frame]').data([0]).join('rect').attr('data-chart-frame','')
      .attr('x',left).attr('y',top).attr('width',width-left-right).attr('height',h-top-bottom)
      .attr('fill','none').attr('stroke','var(--border)');
    svg.selectAll('g.yaxis').data([0]).join('g').attr('class','yaxis').attr('transform',`translate(${left},0)`)
      .call(d3.axisLeft(y).ticks(volume?3:5).tickFormat(volume?d3.format('~g'):d3.format('.2f')));
    svg.selectAll('g.xaxis').data([0]).join('g').attr('class','xaxis').attr('transform',`translate(0,${h-bottom})`)
      .call(d3.axisBottom(x).tickValues(vals).tickFormat(i=>bars[Math.round(i)]?.date.slice(2)||''));
    const tickText=svg.selectAll('.xaxis .tick text');
    tickText.attr('text-anchor',(_,i)=>i===0?'start':i===vals.length-1?'end':'middle');
    svg.selectAll('text.ytitle').data([volume?'量（百萬股）':'Raw價格']).join('text')
      .attr('class','axis-title ytitle').attr('data-axis','y').attr('x',left).attr('y',14).text(d=>d);
    svg.selectAll('text.xtitle').data([0]).join('text').attr('class','axis-title xtitle')
      .attr('data-axis','x').attr('x',width-right).attr('y',h-4).attr('text-anchor','end').text('交易日');
    // All label sets are measured together; optional ticks are removed before any font shrinking.
    const nodes=[...svg.node().querySelectorAll('.tick text,.axis-title')];
    let accepted=[];
    for(const node of nodes){
      const box=node.getBoundingClientRect();
      if(node.closest('.xaxis')&&accepted.some(b=>!(box.right+4<b.left||box.left>b.right+4||box.bottom+4<b.top||box.top>b.bottom+4))){node.setAttribute('visibility','hidden');continue;}
      node.removeAttribute('visibility');accepted.push(box);
    }
  }
  function guides(){
    const selectedVisible=state.selected>=state.first&&state.selected<state.first+state.count;
    const queryVisible=selectedVisible&&state.mode==='query';
    const selectedBar=bars[state.selected];
    if(state.mode==='query'&&selectedVisible)state.guide=x(state.selected);
    for(const [svg,h] of [[px,priceH],[vx,volumeH]]){
      svg.selectAll('line.guide').data(state.guide===null?[]:[state.guide]).join('line').attr('class','guide')
        .attr('data-chart-hover-guide','').attr('x1',d=>d).attr('x2',d=>d).attr('y1',top).attr('y2',h-bottom);
    }
    px.selectAll('line.close-guide').data(queryVisible?[selectedBar]:[]).join('line').attr('class','close-guide')
      .attr('x1',left).attr('x2',width-right).attr('y1',b=>py(b.c)).attr('y2',b=>py(b.c))
      .attr('stroke','var(--foreground)').attr('opacity',.35).attr('stroke-width',1).attr('pointer-events','none');
    for(const [svg,scale,key] of [[px,py,'c'],[vx,vy,'v']]){
      svg.selectAll('circle.query-point').data(queryVisible?[selectedBar]:[]).join('circle')
        .attr('class','query-point').attr('data-chart-hover-marker','').attr('cx',b=>x(b.i))
        .attr('cy',b=>scale(b[key])).attr('r',3).attr('fill','var(--foreground)').attr('pointer-events','none');
    }
  }
  function draw(animate=false){
    width=Math.max(260,root.getBoundingClientRect().width);drawNumber++;
    const shown=bars.slice(state.first,state.first+state.count);
    const frameW=width-left-right, pad=Math.min(6,frameW/state.count*.4);
    x=d3.scaleLinear().domain([state.first-.5,state.first+state.count-.5]).range([left+pad,width-right-pad]);
    const [lo,hi]=d3.extent(shown.flatMap(b=>[b.l,b.h]));
    py=d3.scaleLinear().domain(extent(lo,hi)).range([priceH-bottom-4,top+4]);
    const maxVolume=d3.max(shown,b=>b.v)||1;
    vy=d3.scaleLinear().domain([0,maxVolume*1.15]).range([volumeH-bottom-4,top+4]);
    axes(px,py,priceH,false);axes(vx,vy,volumeH,true);
    bounds={left,right:width-right,top,bottom:priceH-bottom};
    const bw=Math.max(.65,frameW/state.count*.65);
    const duration=animate&&!reduced?130:0;
    for(const svg of [px,vx])svg.selectAll('g.marks').data([0]).join('g').attr('class','marks');
    const marks=px.select('g.marks');
    const color=b=>b.c>b.o?'var(--red)':b.c<b.o?'var(--green)':'var(--foreground)';
    const wicks=marks.selectAll('line.wick').data(shown,b=>b.date).join('line').attr('class','wick').attr('stroke',color).attr('stroke-width',1);
    wicks.transition().duration(duration).attr('x1',b=>x(b.i)).attr('x2',b=>x(b.i)).attr('y1',b=>py(b.h)).attr('y2',b=>py(b.l));
    const bodies=marks.selectAll('rect.candle').data(shown,b=>b.date).join('rect').attr('class','candle').attr('fill',color);
    bodies.transition().duration(duration).attr('x',b=>x(b.i)-bw/2).attr('y',b=>py(Math.max(b.o,b.c)))
      .attr('width',bw).attr('height',b=>Math.max(1,Math.abs(py(b.o)-py(b.c))));
    const volumeMarks=vx.select('g.marks').selectAll('rect.vol').data(shown,b=>b.date).join('rect').attr('class','vol').attr('fill',color);
    volumeMarks.transition().duration(duration).attr('x',b=>x(b.i)-bw/2).attr('y',b=>vy(b.v)).attr('width',bw)
      .attr('height',b=>vy(0)-vy(b.v));
    const cVisible=g2>=state.first&&g2<state.first+state.count;
    px.selectAll('line.c-reference').data(cVisible?[0]:[]).join('line').attr('class','c-reference')
      .attr('x1',x(g2)).attr('x2',x(g2)).attr('y1',top).attr('y2',priceH-bottom)
      .attr('stroke','var(--viz-series-1)').attr('stroke-width',1).attr('stroke-dasharray','4 4');
    px.selectAll('circle.c-source').data(cVisible?[0]:[]).join('circle').attr('class','c-source')
      .attr('cx',x(g2)).attr('cy',py(31.80)).attr('r',4).attr('fill','var(--viz-series-1)');
    px.selectAll('text.c-label').data(cVisible?[0]:[]).join('text').attr('class','c-label')
      .attr('x',Math.max(left+5,Math.min(width-right-65,x(g2)+6))).attr('y',top+14).text('C 1/19');
    root.querySelector('.range').textContent=`${shown[0].date}～${shown.at(-1).date}｜${state.count}根｜僅閱讀窗${cVisible?'':'｜C在畫外'}`;
    root.dataset.first=String(state.first);root.dataset.count=String(state.count);root.dataset.render=String(drawNumber);
    root.dataset.analysisAsOf=data.analysis_as_of;
    for(const [svg,h] of [[px,priceH],[vx,volumeH]]){
      const overlay=svg.selectAll('rect.hit').data([0]).join('rect').attr('class','hit').attr('data-chart-hit','')
        .attr('data-chart-hover-overlay','cross-series').attr('x',left).attr('y',top)
        .attr('width',frameW).attr('height',h-top-bottom).attr('fill','transparent').style('touch-action','none');
      attach(overlay.node());
      overlay.raise();
    }
    guides();
  }
  const pointers=new Map();let drag=null,pinch=null;
  function relative(event){return event.clientX-px.node().getBoundingClientRect().left;}
  function inspect(event,pin=false){
    const at=Math.max(left,Math.min(width-right,relative(event)));
    state.guide=at;
    const available=bars.slice(state.first,state.first+state.count);
    const nearest=d3.bisector(b=>b.i).center(available,x.invert(at));
    const b=available[nearest];
    if(pin){detail(b.i,event.pointerType!=='mouse');state.guide=x(b.i);}
    tip.textContent=`鄰近日K ${b.date}｜高${b.high} 收${b.close}｜量${fmt(+b.volume_shares_scaled)}股`;
    const rr=root.getBoundingClientRect();tip.style.left=Math.min(Math.max(0,at-100),Math.max(0,width-240))+'px';
    tip.style.top=Math.max(0,event.clientY-rr.top-60)+'px';tip.hidden=false;guides();
  }
  function attach(node){
    node.onpointerdown=event=>{
      node.setPointerCapture(event.pointerId);pointers.set(event.pointerId,{x:event.clientX,y:event.clientY});
      if(pointers.size===1){drag={x:event.clientX,y:event.clientY,first:state.first,moved:false};if(state.mode==='query')inspect(event,true);}
      if(pointers.size===2){const p=[...pointers.values()];pinch={distance:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),count:state.count,first:state.first};}
    };
    node.onpointermove=event=>{
      if(pointers.has(event.pointerId))pointers.set(event.pointerId,{x:event.clientX,y:event.clientY});
      if(pointers.size===2&&pinch){const p=[...pointers.values()],distance=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
        if(distance>8){const count=Math.round(pinch.count*pinch.distance/distance);setWindow(pinch.first+(pinch.count-count)/2,count,false);if(drag)drag.moved=true;}return;}
      if(pointers.size===1&&drag){const dx=event.clientX-drag.x;
        if(state.mode==='query'){drag.moved=true;inspect(event,true);return;}
        if(Math.abs(dx)>5){drag.moved=true;setWindow(drag.first-dx/(width-left-right)*state.count,state.count,false);}return;}
      if(event.pointerType==='mouse')inspect(event,state.mode==='query');
    };
    node.onpointerup=event=>{if(drag&&!drag.moved&&pointers.size===1)inspect(event,true);pointers.delete(event.pointerId);if(pointers.size<2)pinch=null;if(!pointers.size)drag=null;};
    node.onpointercancel=event=>{pointers.delete(event.pointerId);drag=null;pinch=null;tip.hidden=true;};
    node.onpointerleave=()=>{if(!pointers.size){tip.hidden=true;if(state.mode!=='query')state.guide=null;guides();}};
    node.onwheel=event=>{event.preventDefault();zoom(event.deltaY<0?.8:1.25,(relative(event)-left)/(width-left-right));};
  }
  root.querySelectorAll('[data-action]').forEach(button=>button.addEventListener('click',()=>{
    switch(button.dataset.action){
      case 'in':zoom(.6);break;case 'out':zoom(1/.6);break;
      case 'left':setWindow(state.first-state.count*.3,state.count);break;
      case 'right':setWindow(state.first+state.count*.3,state.count);break;
      case 'g2':setWindow(initial.first,initial.count);choose(g2);break;
      case 'prev':choose(state.selected-1);break;
      case 'next':choose(state.selected+1);break;
    }
  }));
  root.querySelectorAll('[data-mode]').forEach(button=>button.addEventListener('click',()=>{
    state.mode=button.dataset.mode;root.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));
    tip.hidden=true;guides();
  }));
  root.dataset.draftStatus='DRAFT_NOT_SUBMITTED_NOT_APPROVED';
  root.querySelectorAll('[data-endpoint]').forEach(button=>button.addEventListener('click',()=>{
    if(button.dataset.endpoint==='start')state.draftStart=state.selected;else state.draftEnd=state.selected;draft();
  }));
  new ResizeObserver(()=>draw(false)).observe(root);
  detail(g2);draw(false);
})();
</script>
