        detail.textContent='9/23 量 1.31億股；9/30 量 1.05億股。9/30之後資料未提供，後續增量待追蹤。';
        buttons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.range===range)));
      }
      buttons.forEach(b=>b.addEventListener('click',()=>{range=b.dataset.range;updateDetail();draw();}));
      function draw(){
        if(!window.d3)return;
        const d3=window.d3,w=Math.max(280,root.querySelector('.m1-plot').clientWidth),left=12,right=64,pw=w-left-right;
        const offset=range==='recent'?Math.max(0,allBars.length-36):0,bars=allBars.slice(offset);
        const ph=270,vh=128,top=28,pbottom=ph-38,vbottom=vh-38;
        const indices=d3.range(bars.length),x=d3.scaleLinear().domain([-.5,bars.length-.5]).range([left,left+pw]);
        const ext=d3.extent(bars.flatMap(d=>[d.l,d.h]).concat(refs.map(r=>+r.price),[Number(raw.earlier_cluster_high.price)]));
        const pad=(ext[1]-ext[0])*.10,y=d3.scaleLinear().domain([ext[0]-pad,ext[1]+pad]).range([pbottom,top]);
        const vy=d3.scaleLinear().domain([0,d3.max(bars,d=>d.v)*1.08]).range([vbottom,20]);
        const p=d3.select(root.querySelector('[data-price]')),v=d3.select(root.querySelector('[data-volume]'));
        p.attr('viewBox',`0 0 ${w} ${ph}`).attr('height',ph);v.attr('viewBox',`0 0 ${w} ${vh}`).attr('height',vh);p.selectAll('*').remove();v.selectAll('*').remove();
        const text=(g,xx,yy,s,anchor='start')=>g.append('text').attr('x',xx).attr('y',yy).attr('text-anchor',anchor).text(s);
        p.append('rect').attr('data-chart-frame','').attr('x',left).attr('y',top).attr('width',pw).attr('height',pbottom-top).attr('fill','none').attr('stroke','var(--border)');
        v.append('rect').attr('data-chart-frame','').attr('x',left).attr('y',20).attr('width',pw).attr('height',vbottom-20).attr('fill','none').attr('stroke','var(--border)');
        const ticks=y.ticks(4);ticks.forEach(t=>{p.append('line').attr('x1',left).attr('x2',left+pw).attr('y1',y(t)).attr('y2',y(t)).attr('stroke','var(--border)').attr('stroke-width',.7);text(p,left+pw+8,y(t)+4,t.toFixed(2));});
        text(p,left,16,'價格（元）').attr('class','axis-title').attr('data-axis','y');
        const tickIdx=[0,Math.round((bars.length-1)/2),bars.length-1];
        tickIdx.forEach((i,j)=>{const xx=j===0?left:j===2?left+pw:x(i);text(p,xx,ph-8,bars[i].date.slice(5).replace('-','/'),j===0?'start':j===2?'end':'middle');});
        text(p,left+pw,ph-23,'2026 日期','end').attr('class','axis-title').attr('data-axis','x');
        const cw=Math.max(.8,Math.min(5,pw/bars.length*.70));
        bars.forEach((d,i)=>{
          const col=d.c>=d.o?'var(--red)':'var(--green)';
          p.append('line').attr('x1',x(i)).attr('x2',x(i)).attr('y1',y(d.h)).attr('y2',y(d.l)).attr('stroke',col).attr('stroke-width',.9);
          p.append('rect').attr('x',x(i)-cw/2).attr('y',Math.min(y(d.o),y(d.c))).attr('width',cw).attr('height',Math.max(.8,Math.abs(y(d.o)-y(d.c)))).attr('fill',col);
          v.append('rect').attr('x',x(i)-cw/2).attr('y',vy(d.v)).attr('width',cw).attr('height',vbottom-vy(d.v)).attr('fill',col);
        });
        for(const [period,color] of [['20','var(--viz-series-3)'],['60','var(--viz-series-4)']]){
          const line=d3.line().defined(d=>d.value!==null).x(d=>x(d.i)).y(d=>y(+d.value));
          p.append('path').attr('d',line(raw.ma[period].slice(offset).map((value,i)=>({value,i})))).attr('fill','none').attr('stroke',color).attr('stroke-width',1.1);
        }
        refs.forEach((r,i)=>{
          const k=bars.findIndex(d=>d.date===r.date),col=r.label==='④'?'var(--viz-series-1)':'var(--muted-foreground)';
          p.append('line').attr('x1',k>=0?x(k):left).attr('x2',left+pw).attr('y1',y(+r.price)).attr('y2',y(+r.price)).attr('stroke',col).attr('stroke-width',1.3).attr('stroke-dasharray','4 4');
          if(k>=0)p.append('circle').attr('cx',x(k)).attr('cy',y(+r.price)).attr('r',4).attr('fill',col);
          text(p,k>=0?x(k):left+6,y(+r.price)-9,r.label,k>=0?'middle':'start');
        });
        const other=raw.earlier_cluster_high,oi=bars.findIndex(d=>d.date===other.date);
        if(oi>=0){p.append('circle').attr('cx',x(oi)).attr('cy',y(+other.price)).attr('r',3).attr('fill','var(--muted-foreground)');text(p,x(oi),top-7,'影線 '+other.price,'middle');}
        text(v,left,14,'成交量（股）').attr('class','axis-title').attr('data-axis','y');
        text(v,left+pw+8,24,(d3.max(bars,d=>d.v)/1e8).toFixed(2)+'億');
        text(v,left+pw,vh-5,'日期','end').attr('class','axis-title').attr('data-axis','x');
        for(const [date,row] of [['2026-09-23',0],['2026-09-30',1]]){
          const i=bars.findIndex(d=>d.date===date);if(i<0)continue;
          v.append('circle').attr('cx',x(i)).attr('cy',vy(bars[i].v)).attr('r',3).attr('fill','var(--viz-series-1)');
          text(v,x(i),vbottom+14+row*14,date.slice(5).replace('-','/'),i>bars.length-3?'end':'middle');
        }
        const guides=[p.append('line'),v.append('line')];guides.forEach((g,i)=>g.attr('y1',i===0?top:20).attr('y2',i===0?pbottom:vbottom).attr('stroke','var(--foreground)').attr('stroke-width',1).attr('visibility','hidden'));
        const tooltip=root.querySelector('[role="tooltip"]');
        const show=(event)=>{const xx=Math.max(left,Math.min(left+pw,d3.pointer(event,root.querySelector('[data-price]'))[0]));const i=Math.max(0,Math.min(bars.length-1,Math.round(x.invert(xx))));const d=bars[i];guides.forEach(g=>g.attr('x1',xx).attr('x2',xx).attr('visibility','visible'));tooltip.hidden=false;tooltip.textContent=`${d.date}　開 ${d.o.toFixed(2)}　高 ${d.h.toFixed(2)}　低 ${d.l.toFixed(2)}　收 ${d.c.toFixed(2)}　量 ${d.v.toLocaleString('en-US')} 股`;tooltip.style.position='absolute';tooltip.style.left='8px';tooltip.style.right='8px';tooltip.style.top='38px';tooltip.style.background='var(--popover)';tooltip.style.color='var(--popover-foreground)';};
        p.append('rect').attr('data-chart-hit','').attr('x',left).attr('y',top).attr('width',pw).attr('height',pbottom-top).attr('fill','transparent').on('pointermove',show).on('pointerdown',show).on('pointerleave',()=>{tooltip.hidden=true;guides.forEach(g=>g.attr('visibility','hidden'));});
      }
      updateDetail();draw();new ResizeObserver(draw).observe(root.querySelector('.m1-plot'));
    })();
  </script>
</div>
